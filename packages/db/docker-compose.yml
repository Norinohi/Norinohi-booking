name: yacht-charter

services:
  postgres:
    image: postgres:18
    container_name: yacht-charter-postgres
    environment:
      POSTGRES_DB: yacht-charter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - yacht-charter_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  yacht-charter_postgres_data:
